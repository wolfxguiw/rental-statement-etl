name: Synthetic test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and synthetic-test dependencies
        run: python -m pip install -r requirements-runtime.txt reportlab==4.5.1
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
